name: Refresh content
on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * 1"
permissions:
  contents: read
concurrency:
  group: refresh-content
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync:all
      - run: npm run check
      - name: Package validated offline content
        uses: actions/upload-artifact@v7
        with:
          name: validated-offline-content
          retention-days: 14
          path: |
            public/data
            public/maps
            public/quest-images
            src/maps/catalog.json
